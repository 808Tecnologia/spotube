name: aural_flow
description: "808 - Next Generation Music Experience"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  equatable: ^2.0.5

  # Functional Programming
  fpdart: ^1.1.0

  # Audio Engine
  media_kit: ^1.1.10
  media_kit_libs_audio: ^1.1.3
  audio_service: ^0.18.12

  # Network & Data
  dio: ^5.4.0
  youtube_explode_dart: ^2.2.2
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18

  # UI & Media
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  freezed: ^2.4.5
  drift_dev: ^2.14.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
